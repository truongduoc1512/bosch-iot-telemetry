version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: iot_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iot_telemetry_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot-network

  backend-api:
    image: iot-telemetry-backend:v1
    container_name: iot_backend_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/iot_telemetry_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: devpassword
    depends_on:
      - mysql-db
    networks:
      - iot-network

volumes:
  mysql_data:
    # Volume giúp giữ lại dữ liệu kể cả khi bạn xóa container

networks:
  iot-network:
    driver: bridge