version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: iot_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iot_telemetry_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot-network

volumes:
  mysql_data:
    # Volume giúp giữ lại dữ liệu kể cả khi bạn xóa container

networks:
  iot-network:
    driver: bridge